<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruvaG3</title>
<meta name="description" content="TruvaG3 — a Go framework for micro-agents: true dynamic discovery, decentralized coordination, observable by default.">
<link rel="stylesheet" href="/assets/css/brand.css">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: #fff;
    color: #222;
    text-align: center;
    padding: 2rem;
    line-height: 1.6;
  }
  h1 {
    font-size: 4rem;
    font-weight: 800;
    margin: 0 0 0.5rem;
    line-height: 1;
  }
  .tagline {
    color: #555;
    font-size: 1.1rem;
    margin: 0 0 2rem;
    max-width: 36rem;
  }
  .note {
    color: #888;
    font-size: 0.95rem;
    margin: 0 0 1rem;
  }
  a {
    color: var(--brand-truva-dark);
    text-decoration: none;
    font-weight: 600;
  }
  a:hover {
    text-decoration: underline;
  }
  @media (max-width: 600px) {
    h1 { font-size: 2.75rem; }
  }
</style>
</head>
<body>
  <h1><span class="brand-truva">Truva</span><span class="brand-g3">G3</span></h1>
  <p class="tagline">True. Dynamic discovery. Decentralized. Observable.</p>
  <p class="note">The full site is under construction.</p>
  <p>In the meantime: <a href="https://docs.truvag3.dev">read the docs →</a></p>
