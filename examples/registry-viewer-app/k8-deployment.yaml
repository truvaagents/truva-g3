# Registry Viewer - Kubernetes Deployment
# Connects to Redis service defined in ../k8-deployment/redis.yaml
# Redis topology is resolved through the framework's shared configuration.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-viewer-config
  namespace: truvag3-examples
  labels:
    app: registry-viewer
    component: ui
data:
  TRUVAG3_REDIS_MODE: "standalone"
  TRUVAG3_REDIS_ADDRS: "redis:6379"
  TRUVAG3_REDIS_MASTER_NAME: ""
  TRUVAG3_REDIS_DB: "0"
  TRUVAG3_REDIS_NAMESPACE: "default"
  TRUVAG3_REDIS_TLS_ENABLED: "false"
  TRUVAG3_REDIS_TLS_SERVER_NAME: ""
  TRUVAG3_REDIS_CA_FILE: ""
  TRUVAG3_REDIS_POOL_SIZE: ""
  TRUVAG3_REDIS_MIN_IDLE_CONNS: ""
  TRUVAG3_REDIS_DIAL_TIMEOUT: ""
  TRUVAG3_REDIS_READ_TIMEOUT: ""
  TRUVAG3_REDIS_WRITE_TIMEOUT: ""
  TRUVAG3_REDIS_MAX_RETRIES: ""
  USE_MOCK: "false"
  PORT: "8361"
  APP_ENV: "development"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  JAEGER_UI_URL: "http://jaeger.localhost"
  TRUVAG3_VIEWER_MEMORY_DOMAINS: "infrastructure"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-viewer
  namespace: truvag3-examples
  labels:
    app: registry-viewer
    component: ui
    truvag3.io/setup-workload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-viewer
  template:
    metadata:
      labels:
        app: registry-viewer
        component: ui
    spec:
      containers:
      - name: registry-viewer
        image: registry-viewer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8361
          name: http
        # Non-secret topology and Viewer settings come from the ConfigMap.
        # REDIS_URL and ACL credentials stay in a Secret because the URL may
        # itself contain credentials.
        envFrom:
        - configMapRef:
            name: registry-viewer-config
        - secretRef:
            name: registry-viewer-redis-credentials
            optional: true
        volumeMounts:
        - name: redis-ca
          mountPath: /etc/truvag3/redis-ca
          readOnly: true
        resources:
          requests:
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "192Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8361
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/readiness
            port: 8361
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: redis-ca
        secret:
          secretName: registry-viewer-redis-ca
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: registry-viewer-service
  namespace: truvag3-examples
  labels:
    app: registry-viewer
    component: ui
    truvag3.io/setup-workload: "true"
spec:
  type: ClusterIP
  ports:
  - port: 8361
    targetPort: 8361
    protocol: TCP
    name: http
  selector:
    app: registry-viewer
