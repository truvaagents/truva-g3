# Kubernetes Deployment for Async Travel Research Agent (EMBEDDED MODE)
# Agent Namespace: truvag3-examples
# Infrastructure Namespace: default
# Port: 8351
#
# This deployment runs in EMBEDDED mode (TRUVAG3_MODE unset or "embedded"):
# - Both API and Workers run in the same process
# - Suitable for development, testing, or simple deployments
#
# For PRODUCTION, use the split deployments:
#   - k8-deployment-api.yaml    (TRUVAG3_MODE=api)
#   - k8-deployment-worker.yaml (TRUVAG3_MODE=worker)
#
# This agent uses the Truva-G3 async task system for long-running multi-tool orchestration.
#
# Prerequisites (deploy these first):
#   - Redis (for task queue and discovery)
#   - geocoding-tool
#   - weather-tool-v2
#   - news-tool
#   - currency-tool
#   - stock-market-tool
#
# API Endpoints:
#   POST /api/v1/tasks       - Submit async travel research task (returns 202 + task ID)
#   GET  /api/v1/tasks/:id   - Poll task status/result
#   POST /api/v1/tasks/:id/cancel - Cancel running task

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: async-travel-agent-config
  namespace: truvag3-examples
  labels:
    app: async-travel-agent
    component: agent
    framework: truvag3
data:
  # Deployment identity (kept in YAML — not user-tunable per-env)
  APP_ENV: "production"
  PORT: "8351"
  NAMESPACE: "truvag3-examples"

  # Worker count (deployment-shape; can be tuned via .env if desired)
  WORKER_COUNT: "3"

  # Framework tunables (DEV_MODE, TRUVAG3_LOG_LEVEL, TRUVAG3_LOG_FORMAT,
  # TRUVAG3_DEBUG, TRUVAG3_VALIDATE_PAYLOADS, TRUVAG3_EXECUTION_DEBUG_STORE_ENABLED,
  # TRUVAG3_LLM_DEBUG_ENABLED, TRUVAG3_HTTP_READ_TIMEOUT, TRUVAG3_HTTP_WRITE_TIMEOUT,
  # and model aliases) are sourced from .env via the
  # async-travel-agent-env-config ConfigMap.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-travel-agent
  namespace: truvag3-examples
  labels:
    app: async-travel-agent
    component: agent
    framework: truvag3
    version: v1
    module: async
spec:
  replicas: 1
  selector:
    matchLabels:
      app: async-travel-agent
  template:
    metadata:
      labels:
        app: async-travel-agent
        component: agent
        framework: truvag3
        version: v1
        module: async
      annotations:
        # Uses OTLP push-based telemetry to OTEL Collector, not Prometheus pull scraping
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: default

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: agent
        image: async-travel-agent:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8351
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: async-travel-agent-config
        - configMapRef:
            name: async-travel-agent-env-config
            optional: true  # Created by setup.sh from .env values
        - secretRef:
            name: ai-provider-keys-async-agent
            optional: true

        # Additional environment variables
        env:
        - name: TRUVAG3_AGENT_NAME
          value: "async-travel-agent"
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_REDIS_URL  # For backward compatibility
          value: "redis://redis.truvag3-examples:6379"
        # Redis Registration Resilience (handles Redis startup race conditions)
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        # K8s service discovery configuration (CRITICAL for proper registration)
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "async-travel-agent-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Telemetry Configuration
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        # Timeouts (TRUVAG3_HTTP_WRITE_TIMEOUT, TRUVAG3_HTTP_READ_TIMEOUT) and
        # model aliases (TRUVAG3_OPENAI_MODEL_*, TRUVAG3_ANTHROPIC_MODEL_*) are
        # configured via .env and loaded from async-travel-agent-env-config.

        # Resource limits
        resources:
          requests:
            cpu: "15m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Startup probe (for slow-starting applications)
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: async-travel-agent-service
  namespace: truvag3-examples
  labels:
    app: async-travel-agent
    component: agent
    framework: truvag3
    truvag3.framework/type: agent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8351
    protocol: TCP
  selector:
    app: async-travel-agent

---
# Ingress for external access via async-travel-agent.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: async-travel-agent-ingress
  namespace: truvag3-examples
  labels:
    app: async-travel-agent
    component: agent
    framework: truvag3
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
  - host: async-travel-agent.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: async-travel-agent-service
            port:
              number: 80

---
# Horizontal Pod Autoscaler
# For async agents, scaling based on CPU/memory is appropriate since
# task queue depth can cause CPU spikes during processing
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: async-travel-agent-hpa
  namespace: truvag3-examples
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: async-travel-agent
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

