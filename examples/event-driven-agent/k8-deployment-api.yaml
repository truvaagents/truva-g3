# Kubernetes Deployment for Event-Driven Agent - API Component
# Namespace: truvag3-examples
# Port: 8372
#
# This deployment runs in API mode (TRUVAG3_MODE=api):
# - Handles HTTP requests (AlertManager webhooks, HITL commands, task polling)
# - Enqueues tasks to Redis queue
# - Does NOT process tasks (workers do that)
#
# Deploy this alongside k8-deployment-worker.yaml for split mode.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-driven-agent-api-config
  namespace: truvag3-examples
  labels:
    app: event-driven-agent-api
    component: api
    framework: truvag3
data:
  APP_ENV: "production"
  PORT: "8372"
  NAMESPACE: "truvag3-examples"
  TRUVAG3_MODE: "api"
  DEV_MODE: "false"
  TRUVAG3_LOG_LEVEL: "info"
  TRUVAG3_LLM_DEBUG_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.truvag3-examples:4318"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-driven-agent-api
  namespace: truvag3-examples
  labels:
    app: event-driven-agent-api
    component: api
    framework: truvag3
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-agent-api
  template:
    metadata:
      labels:
        app: event-driven-agent-api
        component: api
        framework: truvag3
        truvag3.framework/type: agent
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8372"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: api
        image: event-driven-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8372
          protocol: TCP
        envFrom:
        - configMapRef:
            name: event-driven-agent-api-config
        - configMapRef:
            name: event-driven-agent-env-config
            optional: true
        - secretRef:
            name: ai-provider-keys-event-agent
            optional: true
        env:
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "event-driven-agent-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_HITL_WEBHOOK_URL
          value: "http://event-driven-agent-service.truvag3-examples/internal/hitl-webhook"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "50m"
            memory: "50Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
# Service routes to API pods (AlertManager webhook target)
apiVersion: v1
kind: Service
metadata:
  name: event-driven-agent-service
  namespace: truvag3-examples
  labels:
    app: event-driven-agent-api
    component: api
    framework: truvag3
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: event-driven-agent-api
