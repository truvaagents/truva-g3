# Kubernetes Deployment for Event-Driven Agent - Worker Component
# Namespace: truvag3-examples
# Port: 8372 (health/metrics only)
#
# This deployment runs in Worker mode (TRUVAG3_MODE=worker):
# - Dequeues tasks from Redis queue
# - Executes AI orchestration (tool calls, synthesis, HITL)
# - Does NOT handle HTTP API requests (API deployment does that)
#
# Deploy this alongside k8-deployment-api.yaml for split mode.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-driven-agent-worker-config
  namespace: truvag3-examples
  labels:
    app: event-driven-agent-worker
    component: worker
    framework: truvag3
data:
  APP_ENV: "production"
  PORT: "8372"
  NAMESPACE: "truvag3-examples"
  TRUVAG3_MODE: "worker"
  WORKER_COUNT: "3"
  DEV_MODE: "false"
  TRUVAG3_LOG_LEVEL: "info"
  TRUVAG3_LLM_DEBUG_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.truvag3-examples:4318"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-driven-agent-worker
  namespace: truvag3-examples
  labels:
    app: event-driven-agent-worker
    component: worker
    framework: truvag3
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-agent-worker
  template:
    metadata:
      labels:
        app: event-driven-agent-worker
        component: worker
        framework: truvag3
        truvag3.framework/type: agent
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8372"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: worker
        image: event-driven-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8372
          protocol: TCP
        envFrom:
        - configMapRef:
            name: event-driven-agent-worker-config
        - configMapRef:
            name: event-driven-agent-env-config
            optional: true
        - secretRef:
            name: ai-provider-keys-event-agent
            optional: true
        env:
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        # Worker doesn't run the framework HTTP server, but TRUVAG3_AGENT_NAME is required
        # so HITL checkpoints carry the agent identity (used by the registry viewer to
        # route approve/reject commands). TRUVAG3_K8S_SERVICE_NAME points to the API pod's
        # service since it handles HITL HTTP endpoints (command, resume, checkpoints).
        - name: TRUVAG3_AGENT_NAME
          value: "event-driven-agent"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "event-driven-agent-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        # HITL webhook URL points to the API pod which handles HTTP resume requests.
        - name: TRUVAG3_HITL_WEBHOOK_URL
          value: "http://event-driven-agent-service.truvag3-examples/internal/hitl-webhook"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "50m"
            memory: "50Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 15
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
# Worker service (health/metrics only — not routed by AlertManager)
apiVersion: v1
kind: Service
metadata:
  name: event-driven-agent-worker-service
  namespace: truvag3-examples
  labels:
    app: event-driven-agent-worker
    component: worker
    framework: truvag3
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8372
    protocol: TCP
  selector:
    app: event-driven-agent-worker
