# MinIO — S3-compatible object storage for Truva-G3 QA artifacts
# Deploy: kubectl apply -f minio.yaml -n truvag3-examples
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: truvag3-examples
type: Opaque
stringData:
  access-key: "minioadmin"
  secret-key: "minioadmin"
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: truvag3-examples
  labels:
    app: minio
    component: infrastructure
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: truvag3-examples
  labels:
    app: minio
    component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        component: infrastructure
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: access-key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secret-key
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 15
      volumes:
      - name: data
        emptyDir: {}  # Use PVC for persistence in production
---
# Init job: creates the truvag3-qa bucket on first deploy
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: truvag3-examples
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-minio
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z minio.truvag3-examples.svc.cluster.local 9000; do echo "Waiting for MinIO..."; sleep 2; done']
      containers:
      - name: mc
        image: minio/mc:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          mc alias set local http://minio.truvag3-examples.svc.cluster.local:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          mc mb --ignore-existing local/truvag3-qa
          echo "Bucket truvag3-qa created successfully"
          mc ls local/
        env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secret-key
