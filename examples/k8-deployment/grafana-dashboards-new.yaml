                  "legendFormat": "Miss",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  }
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    },
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "auto",
                    "spanNulls": false
                  },
                  "unit": "ops",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Hit"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "green"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Miss"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "red"
                        }
                      }
                    ]
                  }
                ]
              },
              "options": {
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            }
          ]
        }
      ]
    }
  logs-traces.json: |
    {
      "uid": "truvag3-logs-traces",
      "title": "Truva-G3 Logs & Traces",
      "tags": ["truvag3", "logs", "traces", "loki", "jaeger"],
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "schemaVersion": 39,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "links": [
        {
          "type": "dashboards",
          "tags": ["truvag3"],
          "title": "Truva-G3 Dashboards",
          "keepTime": true,
          "includeVars": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Metrics",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "loki_ds",
            "type": "datasource",
            "query": "loki",
            "label": "Logs",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "jaeger_ds",
            "type": "datasource",
            "query": "jaeger",
            "label": "Traces",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "service_name",
            "type": "query",
            "label": "Service",
            "datasource": {
              "type": "loki",
              "uid": "${loki_ds}"
            },
            "query": "label_values({service_name=~\".+\"}, service_name)",
            "current": {},
            "hide": 0,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "options": [],
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Log Overview",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 2,
          "title": "Log Volume by Service",
          "type": "timeseries",
          "datasource": {
            "type": "loki",
            "uid": "${loki_ds}"
          },
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki_ds}"
              },
              "expr": "sum(count_over_time({service_name=~\"$service_name\"} [1m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 30,
                "drawStyle": "bars",
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "axisPlacement": "auto",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "Error Log Count (5m)",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "${loki_ds}"
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki_ds}"
              },
              "expr": "sum(count_over_time({service_name=~\".+\"} |= \"error\" [5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 100 }
                ]
              },
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "title": "Error Log Stream",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "panels": []
        },
        {
          "id": 5,
          "title": "Error Logs",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "${loki_ds}"
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki_ds}"
              },
              "expr": "{service_name=~\"$service_name\"} |= \"error\""
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 6,
          "title": "Traces",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "panels": []
        },
        {
          "id": 7,
          "title": "Trace Search",
          "type": "traces",
          "datasource": {
            "type": "jaeger",
            "uid": "${jaeger_ds}"
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 18 },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "jaeger",
                "uid": "${jaeger_ds}"
              },
              "queryType": "search",
              "service": "$service_name",
              "limit": 20
            }
          ]
        },
        {
          "id": 8,
          "title": "HTTP Traffic Detail",
          "type": "row",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 28 },
          "panels": [
            {
              "id": 9,
              "title": "HTTP Status Code Distribution",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 29 },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum(rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", service_name=~\"$service_name\"}[5m])) by (http_response_status_code)",
                  "legendFormat": "{{http_response_status_code}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "custom": {
                    "fillOpacity": 10,
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "auto",
                    "axisPlacement": "auto",
                    "spanNulls": false
                  },
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": [
                  {
                    "matcher": { "id": "byName", "options": "200" },
                    "properties": [
                      { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }
                    ]
                  },
                  {
                    "matcher": { "id": "byName", "options": "400" },
                    "properties": [
                      { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }
                    ]
                  },
                  {
                    "matcher": { "id": "byName", "options": "404" },
                    "properties": [
                      { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }
                    ]
                  },
                  {
                    "matcher": { "id": "byName", "options": "500" },
                    "properties": [
                      { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                    ]
                  },
                  {
                    "matcher": { "id": "byName", "options": "502" },
                    "properties": [
                      { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                    ]
                  },
                  {
                    "matcher": { "id": "byName", "options": "503" },
                    "properties": [
                      { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                    ]
                  }
                ]
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi"
                }
              }
            },
            {
              "id": 10,
              "title": "HTTP Server Latency P95",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 29 },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "histogram_quantile(0.95, sum(rate(truvag3_http_server_request_duration_seconds_bucket{job=\"otel-collector-metrics\", service_name=~\"$service_name\"}[5m])) by (service_name, le))",
                  "legendFormat": "{{service_name}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "custom": {
                    "fillOpacity": 10,
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "auto",
                    "axisPlacement": "auto",
                    "spanNulls": false
                  },
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi"
                }
              }
            }
          ]
        },
        {
          "id": 11,
          "title": "All Logs",
          "type": "row",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 29 },
          "panels": [
            {
              "id": 12,
              "title": "Full Log Stream",
              "type": "logs",
              "datasource": {
                "type": "loki",
                "uid": "${loki_ds}"
              },
              "gridPos": { "h": 12, "w": 24, "x": 0, "y": 30 },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "${loki_ds}"
                  },
                  "expr": "{service_name=~\"$service_name\"}"
                }
              ],
              "options": {
                "showTime": true,
                "showLabels": true,
                "showCommonLabels": false,
                "wrapLogMessage": true,
                "prettifyLogMessage": false,
                "enableLogDetails": true,
                "sortOrder": "Descending",
                "dedupStrategy": "none"
              }
            }
          ]
        }
      ],
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "weekStart": ""
    }
