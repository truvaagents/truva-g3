apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-new
  namespace: truvag3-examples
  labels:
    app: grafana
    component: monitoring
data:
  platform-overview.json: |
    {
      "uid": "truvag3-platform-overview",
      "title": "Truva-G3 Platform Overview",
      "tags": [
        "truvag3",
        "overview",
        "platform"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "truvag3"
          ],
          "title": "Truva-G3 Dashboards",
          "keepTime": true,
          "includeVars": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "service_type",
            "type": "custom",
            "label": "Service Type",
            "query": "agent,tool",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "options": [
              {
                "selected": true,
                "text": "All",
                "value": "$__all"
              },
              {
                "selected": false,
                "text": "agent",
                "value": "agent"
              },
              {
                "selected": false,
                "text": "tool",
                "value": "tool"
              }
            ],
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"}[$__range]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "justifyMode": "auto",
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "(sum(rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\", http_response_status_code=~\"5..\"}[$__range])) or vector(0)) / clamp_min(sum(rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"}[$__range])), 1e-10) * 100",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "0%",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "justifyMode": "auto",
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "title": "Avg Latency",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(truvag3_http_server_request_duration_seconds_sum{job=\"otel-collector-metrics\", http_request_method=\"POST\"}) / clamp_min(sum(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"}), 1e-10) * 1000",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "noValue": "\u2014",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 500
                  },
                  {
                    "color": "red",
                    "value": 2000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "justifyMode": "auto",
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "title": "Active Services",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(count by (service_name) (truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\"}))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "justifyMode": "auto",
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 5,
          "title": "Service Health",
          "type": "table",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum by (service_name, service_type) (truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"})",
              "refId": "A",
              "legendFormat": "Requests",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (service_name) (truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\", http_response_status_code=~\"5..\"}) or sum by (service_name) (truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"}) * 0",
              "refId": "B",
              "legendFormat": "Errors",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "(sum by (service_name) (rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\", http_response_status_code=~\"5..\"}[6h])) or sum by (service_name) (truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"}) * 0) / clamp_min(sum by (service_name) (rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"}[6h])), 1e-10) * 100",
              "refId": "C",
              "legendFormat": "Error %",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service_name, le) (rate(truvag3_http_server_request_duration_seconds_bucket{job=\"otel-collector-metrics\", http_request_method=\"POST\"}[6h]))) * 1000",
              "refId": "D",
              "legendFormat": "P95 (ms)",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (service_name) (truvag3_tool_call_total{job=\"otel-collector-metrics\"}) or sum by (service_name) (truvag3_request_total{job=\"otel-collector-metrics\"}) * 0",
              "refId": "E",
              "legendFormat": "Tool Calls",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (service_name) (truvag3_ai_request_total{job=\"otel-collector-metrics\"}) or sum by (service_name) (truvag3_request_total{job=\"otel-collector-metrics\"}) * 0",
              "refId": "F",
              "legendFormat": "AI Calls",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "service_name": 0,
                  "service_type": 1,
                  "Value #A": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5,
                  "Value #E": 6,
                  "Value #F": 7
                },
                "renameByName": {
                  "service_name": "Service",
                  "service_type": "Type",
                  "Value #A": "Requests",
                  "Value #B": "Errors",
                  "Value #C": "Error %",
                  "Value #D": "P95 (ms)",
                  "Value #E": "Tool Calls",
                  "Value #F": "AI Calls"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Error %"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 5
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P95 (ms)"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 500
                        },
                        {
                          "color": "red",
                          "value": 2000
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Error %",
                "desc": true
              }
            ],
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false,
              "fields": ""
            }
          }
        },
        {
          "id": 6,
          "title": "Traffic & Latency",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\"}[5m])) by (service_name)",
              "refId": "A",
              "legendFormat": "{{service_name}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                },
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            }
          }
        },
        {
          "id": 8,
          "title": "Request Duration Heatmap",
          "type": "heatmap",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(rate(truvag3_http_server_request_duration_seconds_bucket{job=\"otel-collector-metrics\", http_request_method=\"POST\"}[5m])) by (le)",
              "refId": "A",
              "format": "heatmap",
              "legendFormat": "{{le}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "calculate": false,
            "color": {
              "mode": "scheme",
              "scheme": "YlOrRd",
              "exponent": 0.5
            },
            "yAxis": {
              "unit": "ms",
              "reverse": false
            },
            "cellGap": 1,
            "tooltip": {
              "show": true,
              "yHistogram": false
            },
            "exemplars": {
              "color": "rgba(255,0,255,0.7)"
            },
            "filterValues": {
              "le": 1e-09
            },
            "rowsFrame": {
              "layout": "auto"
            },
            "showValue": "never"
          }
        },
        {
          "id": 9,
          "title": "Errors & Discovery",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "collapsed": true,
          "panels": [
            {
              "id": 10,
              "title": "Errors by Service",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 24
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "sum(rate(truvag3_http_server_request_duration_seconds_count{job=\"otel-collector-metrics\", http_request_method=\"POST\", http_response_status_code=~\"5..\"}[5m])) by (service_name)",
                  "refId": "A",
                  "legendFormat": "{{service_name}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  }
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    },
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "auto",
                    "spanNulls": false
                  },
                  "color": {
                    "mode": "shades",
                    "fixedColor": "red"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            },
            {
              "id": 11,
              "title": "Service Registrations",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 24
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "sum(rate(truvag3_discovery_registrations_total{job=\"otel-collector-metrics\"}[5m])) by (service_name)",
                  "refId": "A",
                  "legendFormat": "{{service_name}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  }
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    },
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "auto",
                    "spanNulls": false
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            }
          ]
        },
        {
          "id": 12,
          "title": "Resource Usage",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "collapsed": true,
          "panels": [
            {
              "id": 13,
              "title": "CPU by Pod",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 32
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "topk(15, sum(rate(container_cpu_usage_seconds_total{namespace=\"truvag3-examples\", container!=\"\", container!=\"POD\"}[5m])) by (pod))",
                  "refId": "A",
                  "legendFormat": "{{pod}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  }
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    },
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "auto",
                    "spanNulls": false
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            },
            {
              "id": 14,
              "title": "Memory by Pod",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 32
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "topk(15, sum(container_memory_working_set_bytes{namespace=\"truvag3-examples\", container!=\"\", container!=\"POD\"}) by (pod) / 1024 / 1024)",
                  "refId": "A",
                  "legendFormat": "{{pod}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  }
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "decmbytes",
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    },
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "auto",
