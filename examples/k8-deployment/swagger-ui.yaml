# Swagger UI for TruvaG3 — interactive OpenAPI documentation for all services.
#
# Each TruvaG3 tool and agent exposes GET /openapi.json (auto-generated by core module).
# Swagger UI auto-discovers the service list at page load by fetching
# /swagger-urls.json — an endpoint proxied to the registry-viewer, which
# reads every registered tool/agent from Redis and returns them in the
# {name, url} array format Swagger UI expects.
#
# The browser then fetches each spec via /svc/{service-name}/openapi.json,
# which the local nginx proxies to the corresponding ClusterIP service via
# kube-dns. The same /svc/{service-name}/<path> prefix proxies "Try it out"
# requests back to the agent's capability endpoints, so users get a working
# curl without each agent having to know its public ingress URL. Nginx sets
# X-Forwarded-Host and X-Forwarded-Prefix so the upstream's /openapi.json
# emits a `servers` URL that round-trips through this proxy. This keeps tools
# internal-only (no per-tool ingress) while still letting the browser-based
# Swagger UI load every spec and call every capability.
#
# Adding a new service:
#   Just deploy it. It registers with Redis on startup, the registry-viewer
#   will include it in /swagger-urls.json, and Swagger UI will show it on
#   the next page refresh. Zero manual config changes required.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swagger-ui-config
  namespace: truvag3-examples
  labels:
    app: swagger-ui
    component: infrastructure
data:
  # Custom swagger-initializer.js — fetches the service list dynamically from
  # /swagger-urls.json (proxied to the registry-viewer) so new tools/agents
  # appear automatically without editing this ConfigMap. If the fetch fails,
  # Swagger UI falls back to the petstore example so the page still loads.
  swagger-initializer.js: |
    window.onload = function() {
      const commonConfig = {
        dom_id: "#swagger-ui",
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        deepLinking: true,
        displayRequestDuration: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 2,
        tryItOutEnabled: true
      };

      fetch("/swagger-urls.json", { cache: "no-store" })
        .then(function(resp) {
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        })
        .then(function(urls) {
          if (!Array.isArray(urls) || urls.length === 0) {
            throw new Error("empty url list");
          }
          window.ui = SwaggerUIBundle(Object.assign({}, commonConfig, { urls: urls }));
        })
        .catch(function(err) {
          console.error("Failed to load /swagger-urls.json, falling back to petstore:", err);
          window.ui = SwaggerUIBundle(Object.assign({}, commonConfig, {
            url: "https://petstore.swagger.io/v2/swagger.json"
          }));
        });
    };

  # Custom nginx config — serves swagger-ui static assets at / and proxies
  # /svc/{service-name}/<path> to the corresponding internal service. The same
  # path prefix carries the spec fetch and every "Try it out" capability call.
  # Uses the kube-dns resolver (10.96.0.10) for runtime service name resolution.
  default.conf: |
    server {
      listen 8080;
      server_name localhost;

      # Static Swagger UI assets
      location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
      }

      # Auto-discovery feed — proxies to the registry-viewer, which reads
      # all registered tools/agents from Redis and returns them in the
      # {name, url} array format Swagger UI expects in its `urls` config.
      location = /swagger-urls.json {
        resolver 10.96.0.10 valid=30s;
        set $rv http://registry-viewer-service.truvag3-examples.svc.cluster.local:8361/swagger-urls.json;
        proxy_pass $rv;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
      }

      # Proxy ALL requests under /svc/{service}/... to the matching cluster
      # Service. This carries the spec fetch (/svc/{svc}/openapi.json) AND every
      # capability call Swagger UI's "Try it out" form generates against the
      # rendered server URL. X-Forwarded-Host and X-Forwarded-Prefix tell the
      # upstream how it was reached so its /openapi.json emits a `servers` URL
      # that points back through this same proxy. The captured service name
      # must match a Kubernetes Service in truvag3-examples.
      location ~ ^/svc/(?<svc>[a-zA-Z0-9-]+)(?<rest>/.*)?$ {
        resolver 10.96.0.10 valid=30s;
        set $upstream http://$svc.truvag3-examples.svc.cluster.local$rest$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host $svc.truvag3-examples.svc.cluster.local;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /svc/$svc;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  namespace: truvag3-examples
  labels:
    app: swagger-ui
    component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-ui
  template:
    metadata:
      labels:
        app: swagger-ui
        component: infrastructure
    spec:
      # Copy nginx config from ConfigMap into a writable emptyDir.
      # This is needed because swagger-ui's entrypoint runs envsubst and
      # writes /etc/nginx/conf.d/default.conf at startup, which would fail
      # against a read-only configMap mount.
      initContainers:
      - name: copy-nginx-conf
        image: busybox:latest
        command: ["sh", "-c", "cp /src/default.conf /dst/default.conf"]
        volumeMounts:
        - name: swagger-config-src
          mountPath: /src
        - name: nginx-conf
          mountPath: /dst
      containers:
      - name: swagger-ui
        image: swaggerapi/swagger-ui:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: BASE_URL
          value: "/"
        # Disable template processing so the entrypoint doesn't overwrite default.conf
        - name: NGINX_ENVSUBST_TEMPLATE_DIR
          value: "/no-such-dir"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: swagger-config-src
          mountPath: /usr/share/nginx/html/swagger-initializer.js
          subPath: swagger-initializer.js
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: swagger-config-src
        configMap:
          name: swagger-ui-config
      - name: nginx-conf
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: swagger-ui
  namespace: truvag3-examples
  labels:
    app: swagger-ui
    component: infrastructure
spec:
  selector:
    app: swagger-ui
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
