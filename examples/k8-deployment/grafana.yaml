apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: truvag3-examples
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      securityContext:
        fsGroup: 472
        runAsGroup: 472
        runAsUser: 472
      containers:
      - name: grafana
        image: grafana/grafana:11.5.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: grafana-dashboards-new
          # Sibling, not nested under dashboards/ — nesting causes Grafana's
          # `truvag3` provider to also recurse into this directory, producing
          # duplicate-title warnings and locking provisioning writes.
          mountPath: /var/lib/grafana/dashboards-new
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-dashboard-providers
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-dashboards-new
        configMap:
          name: grafana-dashboards-new
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: truvag3-examples
  labels:
    app: grafana
    component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    name: http
  selector:
    app: grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: truvag3-examples
  labels:
    app: grafana
    component: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  # Storage class options for different cloud providers:
  # storageClassName: gp3-csi         # EKS (recommended) - 20% cheaper than gp2
  # storageClassName: premium-rwo     # GKE (SSD) - better performance
  # storageClassName: standard-rwo    # GKE (Standard) - cheaper option
  # storageClassName: managed-premium # AKS (Premium SSD) - better performance
  # storageClassName: managed-csi     # AKS (Standard) - default
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: truvag3-examples
  labels:
    app: grafana
    component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      uid: prometheus
      jsonData:
        # Services export OTLP metrics every 30s (telemetry/otel.go). Setting the
        # scrape interval to match keeps $__rate_interval >= 2m, so rate windows
        # always hold more than two distinct samples.
        timeInterval: 30s
    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://jaeger-query
      uid: jaeger
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          customQuery: true
          # Filter by trace, not span: a single span only owns a handful of a
          # request's log lines.
          query: '{service_name=~".+"} | trace_id="$${__span.traceId}"'
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      uid: loki
      jsonData:
        derivedFields:
        # With matcherType "label", matcherRegex selects the label *name*;
        # trace_id is structured metadata set by the log collector.
        - datasourceUid: jaeger
          matcherRegex: '^trace_id$'
          matcherType: label
          name: TraceID
          url: "$${__value.raw}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: truvag3-examples
  labels:
    app: grafana
    component: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'truvag3'
      orgId: 1
      folder: 'TruvaG3'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
    - name: 'truvag3-new'
      orgId: 1
      folder: 'TruvaG3'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        # Must be a sibling of /var/lib/grafana/dashboards (the `truvag3`
        # provider's path) — nesting causes both providers to scan the same
        # files, which Grafana detects as duplicate dashboards and uses to
        # disable provisioning writes for both providers.
        path: /var/lib/grafana/dashboards-new
---
