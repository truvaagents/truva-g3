              "legendFormat": "P50",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            },
            {
              "expr": "histogram_quantile(0.90, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"truvag3-mock-services\"}[1m]))) * 1000",
              "legendFormat": "P90",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"truvag3-mock-services\"}[1m]))) * 1000",
              "legendFormat": "P95",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"}
        },
        {
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 20}
            }
          },
          "targets": [
            {
              "expr": "rate(http_requests_total{job=\"truvag3-mock-services\"}[1m])",
              "legendFormat": "{{method}} {{path}} ({{status}})",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"}
        },
        {
          "title": "Process Memory (MB)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes",
              "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 15},
