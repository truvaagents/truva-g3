# Note: arXiv API requires NO authentication -- no secrets needed.
# Run ./setup.sh to deploy.
---
apiVersion: v1
kind: Service
metadata:
  name: arxiv-tool-service
  namespace: truvag3-examples
  labels:
    app: arxiv-tool
    component: tool
spec:
  selector:
    app: arxiv-tool
  ports:
    - name: http
      port: 80
      targetPort: 8369
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arxiv-tool
  namespace: truvag3-examples
  labels:
    app: arxiv-tool
    component: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arxiv-tool
  template:
    metadata:
      labels:
        app: arxiv-tool
        component: tool
    spec:
      containers:
      - name: arxiv-tool
        image: arxiv-tool:latest
        imagePullPolicy: Never  # For local Kind cluster
        ports:
        - containerPort: 8369
          name: http
        envFrom:
        - configMapRef:
            name: arxiv-tool-env-config
            optional: true  # Created by setup.sh from .env values
        env:
        - name: PORT
          value: "8369"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        # Redis Registration Resilience
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        # NO API KEY NEEDED -- arXiv is a public API
        - name: DEV_MODE
          value: "false"
        - name: TRUVAG3_LOG_LEVEL
          value: "info"
        - name: TRUVAG3_LOG_FORMAT
          value: "json"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "arxiv-tool-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Telemetry Configuration
        - name: APP_ENV
          value: "development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8369
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: 8369
          initialDelaySeconds: 5
          periodSeconds: 10
