# Kubernetes Deployment for My Async Agent
# Namespace: truvag3-examples
# Port: 8392
---
apiVersion: v1
kind: Service
metadata:
  name: my-async-agent-service
  namespace: truvag3-examples
  labels:
    app: my-async-agent
    component: agent
    framework: truvag3
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: my-async-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-async-agent-config
  namespace: truvag3-examples
  labels:
    app: my-async-agent
    component: agent
    framework: truvag3
data:
  # Deployment identity + in-cluster telemetry (kept in YAML)
  APP_ENV: "production"
  PORT: "8392"
  NAMESPACE: "truvag3-examples"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.truvag3-examples:4318"

  # Framework tunables (DEV_MODE, TRUVAG3_LOG_LEVEL, TRUVAG3_LLM_DEBUG_ENABLED,
  # TRUVAG3_HITL_WEBHOOK_URL) are sourced from .env via the
  # my-async-agent-env-config ConfigMap.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-async-agent
  namespace: truvag3-examples
  labels:
    app: my-async-agent
    component: agent
    framework: truvag3
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-async-agent
  template:
    metadata:
      labels:
        app: my-async-agent
        component: agent
        framework: truvag3
        truvag3.framework/type: agent
        version: v1
      annotations:
        # Uses OTLP push-based telemetry to OTEL Collector, not Prometheus pull scraping
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: agent
        image: my-async-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8392
          protocol: TCP
        envFrom:
        - configMapRef:
            name: my-async-agent-config
        - configMapRef:
            name: my-async-agent-env-config
            optional: true
        - secretRef:
            name: ai-provider-keys-event-agent
            optional: true
        env:
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "my-async-agent-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "15m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
# Ingress for external access via my-async-agent.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-async-agent-ingress
  namespace: truvag3-examples
  labels:
    app: my-async-agent
    component: agent
    framework: truvag3
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
  - host: my-async-agent.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-async-agent-service
            port:
              number: 80
