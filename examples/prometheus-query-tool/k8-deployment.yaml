# Prometheus Query Tool - Kubernetes Deployment
# No secrets required -- Prometheus is accessed in-cluster without auth.
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-query-tool-service
  namespace: truvag3-examples
  labels:
    app: prometheus-query-tool
    component: tool
spec:
  selector:
    app: prometheus-query-tool
  ports:
    - name: http
      port: 80
      targetPort: 8371
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-query-tool
  namespace: truvag3-examples
  labels:
    app: prometheus-query-tool
    component: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-query-tool
  template:
    metadata:
      labels:
        app: prometheus-query-tool
        component: tool
    spec:
      containers:
      - name: prometheus-query-tool
        image: prometheus-query-tool:latest
        imagePullPolicy: Never  # For local Kind cluster
        ports:
        - containerPort: 8371
          name: http
        envFrom:
        - configMapRef:
            name: prometheus-query-tool-env-config
            optional: true  # Created by setup.sh from .env values
        env:
        # --- Core Configuration ---
        - name: PORT
          value: "8371"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        # Redis Registration Resilience (handles Redis startup race conditions)
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        # --- Application Configuration (no secrets needed) ---
        - name: PROMETHEUS_URL
          value: "http://prometheus.truvag3-examples:9090"
        - name: DEV_MODE
          value: "false"
        # --- Logging Configuration ---
        - name: TRUVAG3_LOG_LEVEL
          value: "info"
        - name: TRUVAG3_LOG_FORMAT
          value: "json"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "prometheus-query-tool-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # --- Telemetry Configuration ---
        - name: APP_ENV
          value: "development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8371
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: 8371
          initialDelaySeconds: 5
          periodSeconds: 10
