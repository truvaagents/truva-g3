apiVersion: apps/v1
kind: Deployment
metadata:
  name: geocoding-tool
  namespace: truvag3-examples
  labels:
    app: geocoding-tool
    component: tool
    version: v1.0.0
    truvag3.framework/type: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geocoding-tool
  template:
    metadata:
      labels:
        app: geocoding-tool
        component: tool
        version: v1.0.0
        truvag3.framework/type: tool
      annotations:
        # Uses OTLP push-based telemetry, not Prometheus pull scraping
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: geocoding-tool
        image: geocoding-tool:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8335
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: geocoding-tool-env-config
            optional: true  # Created by setup.sh from .env values
        env:
        - name: TRUVAG3_AGENT_NAME
          value: "geocoding-tool"
        - name: PORT
          value: "8335"
        - name: TRUVAG3_NAMESPACE
          value: "truvag3-examples"
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        # Redis Registration Resilience
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        - name: TRUVAG3_DEV_MODE
          value: "false"
        # Logging Configuration
        - name: TRUVAG3_LOG_LEVEL
          value: "info"
        - name: TRUVAG3_LOG_FORMAT
          value: "json"
        # Kubernetes Service Discovery Configuration
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "geocoding-tool-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TRUVAG3_K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: TRUVAG3_K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Telemetry Configuration
        - name: APP_ENV
          value: "development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8335
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: 8335
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: geocoding-tool-service
  namespace: truvag3-examples
  labels:
    app: geocoding-tool
    component: tool
    truvag3.framework/type: tool
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8335
    protocol: TCP
    name: http
  selector:
    app: geocoding-tool
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geocoding-tool-config
  namespace: truvag3-examples
  labels:
    app: geocoding-tool
    component: tool
data:
  config.yaml: |
    service:
      name: geocoding-tool
      port: 8335
      namespace: truvag3-examples
    api:
      provider: nominatim
      rate_limit: "1/second"
    discovery:
      enabled: true
      provider: redis
      redis_url: redis://redis.truvag3-examples:6379
    logging:
      level: info
      format: json
    cors:
      enabled: true
      origins: ["*"]
