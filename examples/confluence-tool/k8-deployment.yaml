# Note: Secrets are created by setup.sh from .env file
# Run ./setup.sh to deploy with proper API keys
# Or create the secret manually:
#   kubectl create secret generic confluence-tool-secrets \
#     --from-literal=CONFLUENCE_BASE_URL=https://yourcompany.atlassian.net \
#     --from-literal=CONFLUENCE_USER_EMAIL=your-email@example.com \
#     --from-literal=CONFLUENCE_API_TOKEN=your_token -n truvag3-examples
---
apiVersion: v1
kind: Service
metadata:
  name: confluence-tool-service
  namespace: truvag3-examples
  labels:
    app: confluence-tool
    component: tool
spec:
  selector:
    app: confluence-tool
  ports:
    - name: http
      port: 80
      targetPort: 8376
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confluence-tool
  namespace: truvag3-examples
  labels:
    app: confluence-tool
    component: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: confluence-tool
  template:
    metadata:
      labels:
        app: confluence-tool
        component: tool
    spec:
      containers:
      - name: confluence-tool
        image: confluence-tool:latest
        imagePullPolicy: Never  # For local Kind cluster
        ports:
        - containerPort: 8376
          name: http
        envFrom:
        - configMapRef:
            name: confluence-tool-env-config
            optional: true  # Created by setup.sh from .env values
        env:
        - name: PORT
          value: "8376"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        # Redis Registration Resilience (handles Redis startup race conditions)
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        - name: CONFLUENCE_BASE_URL
          valueFrom:
            secretKeyRef:
              name: confluence-tool-secrets
              key: CONFLUENCE_BASE_URL
        - name: CONFLUENCE_USER_EMAIL
          valueFrom:
            secretKeyRef:
              name: confluence-tool-secrets
              key: CONFLUENCE_USER_EMAIL
        - name: CONFLUENCE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: confluence-tool-secrets
              key: CONFLUENCE_API_TOKEN
        - name: DEV_MODE
          value: "false"
        - name: TRUVAG3_LOG_LEVEL
          value: "info"
        - name: TRUVAG3_LOG_FORMAT
          value: "json"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "confluence-tool-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Telemetry Configuration
        - name: APP_ENV
          value: "development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8376
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: 8376
          initialDelaySeconds: 5
          periodSeconds: 10
