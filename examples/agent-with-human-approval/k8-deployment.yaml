# Kubernetes Deployment for Agent with Human Approval (HITL)
# Namespace: truvag3-examples
# Port: 8352

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-with-human-approval-config
  namespace: truvag3-examples
  labels:
    app: agent-with-human-approval
    component: agent
    framework: truvag3
data:
  # Deployment identity (kept in YAML — not user-tunable per-env)
  APP_ENV: "production"
  PORT: "8352"
  NAMESPACE: "truvag3-examples"

  # Framework tunables (DEV_MODE, TRUVAG3_LOG_LEVEL, TRUVAG3_LOG_FORMAT,
  # TRUVAG3_DEBUG, TRUVAG3_VALIDATE_PAYLOADS, TRUVAG3_EXECUTION_DEBUG_STORE_ENABLED,
  # TRUVAG3_LLM_DEBUG_ENABLED, TRUVAG3_ORCHESTRATOR_MODE, TRUVAG3_ORCHESTRATION_TIMEOUT,
  # TRUVAG3_HTTP_READ_TIMEOUT, TRUVAG3_HTTP_WRITE_TIMEOUT) are sourced from .env via
  # the agent-with-human-approval-env-config ConfigMap. HITL-specific keys
  # continue to flow through hitl-config (preserving empty-value semantics).

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-with-human-approval
  namespace: truvag3-examples
  labels:
    app: agent-with-human-approval
    component: agent
    framework: truvag3
    version: v1
    module: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-with-human-approval
  template:
    metadata:
      labels:
        app: agent-with-human-approval
        component: agent
        framework: truvag3
        version: v1
        module: orchestration
      annotations:
        # Uses OTLP push-based telemetry to OTEL Collector, not Prometheus pull scraping
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: default

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: agent
        image: agent-with-human-approval:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8352
          protocol: TCP

        # Environment variables from ConfigMaps and Secrets
        # Order matters: later entries OVERRIDE earlier ones. Framework tunables
        # come from env-config (full .env copy); HITL keys come from hitl-config
        # (curated list with intentional empty values) and win on conflict.
        envFrom:
        - configMapRef:
            name: agent-with-human-approval-config
        - configMapRef:
            name: agent-with-human-approval-env-config
            optional: true  # Created by setup.sh from .env values
        - configMapRef:
            name: hitl-config
            optional: true  # HITL-specific (curated); overrides env-config
        - secretRef:
            name: ai-provider-keys-hitl-agent
            optional: true

        # Additional environment variables
        env:
        - name: TRUVAG3_AGENT_NAME
          value: "agent-with-human-approval"
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_REDIS_URL  # For backward compatibility
          value: "redis://redis.truvag3-examples:6379"
        # Redis Registration Resilience (handles Redis startup race conditions)
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"

        # ============================================
        # HITL (Human-in-the-Loop) Configuration
        # ============================================
        # HITL config is loaded from the 'hitl-config' ConfigMap (created by setup.sh from .env)
        # See orchestration/HUMAN_IN_THE_LOOP_PROPOSAL.md for full reference.
        # To change HITL settings: edit .env file and run: ./setup.sh rollout

        # K8s service discovery configuration (CRITICAL for proper registration)
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "agent-with-human-approval-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Telemetry Configuration
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"

        # Timeouts (TRUVAG3_ORCHESTRATION_TIMEOUT, TRUVAG3_HTTP_WRITE_TIMEOUT,
        # TRUVAG3_HTTP_READ_TIMEOUT) and model aliases are configured via .env
        # and loaded from agent-with-human-approval-env-config ConfigMap.
        # HITL workflows may require longer timeouts for human approval waits.

        # Resource limits
        resources:
          requests:
            cpu: "15m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Startup probe (for slow-starting applications)
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: agent-with-human-approval-service
  namespace: truvag3-examples
  labels:
    app: agent-with-human-approval
    component: agent
    framework: truvag3
    truvag3.framework/type: agent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8352
    protocol: TCP
  selector:
    app: agent-with-human-approval

---
# Ingress for external access via hitl-agent.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hitl-agent-ingress
  namespace: truvag3-examples
  labels:
    app: agent-with-human-approval
    component: agent
    framework: truvag3
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
  - host: hitl-agent.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agent-with-human-approval-service
            port:
              number: 80
