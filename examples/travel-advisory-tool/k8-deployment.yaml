---
apiVersion: v1
kind: Service
metadata:
  name: travel-advisory-tool-service
  namespace: truvag3-examples
  labels:
    app: travel-advisory-tool
    component: tool
spec:
  selector:
    app: travel-advisory-tool
  ports:
    - name: http
      port: 80
      targetPort: 8345
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-advisory-tool
  namespace: truvag3-examples
  labels:
    app: travel-advisory-tool
    component: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-advisory-tool
  template:
    metadata:
      labels:
        app: travel-advisory-tool
        component: tool
    spec:
      containers:
      - name: travel-advisory-tool
        image: travel-advisory-tool:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8345
          name: http
        # User-configurable env vars from .env via setup.sh
        envFrom:
        - configMapRef:
            name: travel-advisory-tool-env-config
            optional: true  # Created by setup.sh from .env values
        # Infrastructure env vars (K8s-internal, not from .env)
        env:
        - name: PORT
          value: "8345"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        # K8s identity
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "travel-advisory-tool-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Telemetry endpoint (K8s-internal address)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8345
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: 8345
          initialDelaySeconds: 5
          periodSeconds: 10
