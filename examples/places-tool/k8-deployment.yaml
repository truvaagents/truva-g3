# Note: Secrets are created by setup.sh from .env file
# Run ./setup.sh to deploy with proper API keys
# Or create the secret manually:
#   kubectl create secret generic places-tool-secrets \
#     --from-literal=FOURSQUARE_API_KEY=your-key \
#     --from-literal=GEOAPIFY_API_KEY=your-key -n truvag3-examples
---
apiVersion: v1
kind: Service
metadata:
  name: places-tool-service
  namespace: truvag3-examples
  labels:
    app: places-tool
    component: tool
spec:
  selector:
    app: places-tool
  ports:
    - name: http
      port: 80
      targetPort: 8344
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: places-tool
  namespace: truvag3-examples
  labels:
    app: places-tool
    component: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: places-tool
  template:
    metadata:
      labels:
        app: places-tool
        component: tool
    spec:
      containers:
      - name: places-tool
        image: places-tool:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8344
          name: http
        # User-configurable env vars from .env via setup.sh
        envFrom:
        - configMapRef:
            name: places-tool-env-config
            optional: true  # Created by setup.sh from .env values
        # Infrastructure env vars (K8s-internal, not from .env)
        env:
        - name: PORT
          value: "8344"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        # Secrets (API keys) - optional: at least one provider needed
        - name: FOURSQUARE_API_KEY
          valueFrom:
            secretKeyRef:
              name: places-tool-secrets
              key: FOURSQUARE_API_KEY
              optional: true
        - name: GEOAPIFY_API_KEY
          valueFrom:
            secretKeyRef:
              name: places-tool-secrets
              key: GEOAPIFY_API_KEY
              optional: true
        # K8s identity
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "places-tool-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Telemetry endpoint (K8s-internal address)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8344
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: 8344
          initialDelaySeconds: 5
          periodSeconds: 10
