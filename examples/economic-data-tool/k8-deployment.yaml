# Note: Secrets and ConfigMaps are created by setup.sh from .env file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: economic-data-tool
  namespace: truvag3-examples
  labels:
    app: economic-data-tool
    truvag3.framework/type: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: economic-data-tool
  template:
    metadata:
      labels:
        app: economic-data-tool
        truvag3.framework/type: tool
    spec:
      containers:
      - name: economic-data-tool
        image: economic-data-tool:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8363
          name: http
        envFrom:
        - configMapRef:
            name: economic-data-tool-env-config
            optional: true
        env:
        - name: DEV_MODE
          value: "false"
        - name: PORT
          value: "8363"
        - name: TRUVAG3_NAMESPACE
          value: "truvag3-examples"
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "economic-data-tool-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TRUVAG3_K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: TRUVAG3_K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: FRED_API_KEY
          valueFrom:
            secretKeyRef:
              name: economic-data-tool-secrets
              key: FRED_API_KEY
              optional: true
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8363
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: 8363
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: economic-data-tool-service
  namespace: truvag3-examples
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8363
  selector:
    app: economic-data-tool
