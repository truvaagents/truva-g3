# Kubernetes Deployment for DevOps Chat Agent
# Namespace: truvag3-examples
# Port: 8357

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-chat-agent-config
  namespace: truvag3-examples
  labels:
    app: devops-chat-agent
    component: agent
    framework: truvag3
data:
  # Environment configuration
  APP_ENV: "production"
  PORT: "8357"
  NAMESPACE: "truvag3-examples"

  # Framework configuration
  DEV_MODE: "false"
  TRUVAG3_LOG_LEVEL: "info"
  TRUVAG3_DEBUG: "false"
  TRUVAG3_VALIDATE_PAYLOADS: "false"
  TRUVAG3_EXECUTION_DEBUG_STORE_ENABLED: "true"

  # HITL configuration is sourced from .env via the devops-chat-agent-env-config
  # ConfigMap (see TRUVAG3_HITL_* in .env / .env.example).
  TRUVAG3_AGENT_NAME: "devops-chat-agent"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-chat-agent
  namespace: truvag3-examples
  labels:
    app: devops-chat-agent
    component: agent
    framework: truvag3
    version: v1
    module: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-chat-agent
  template:
    metadata:
      labels:
        app: devops-chat-agent
        component: agent
        framework: truvag3
        version: v1
        module: orchestration
      annotations:
        # Uses OTLP push-based telemetry to OTEL Collector, not Prometheus pull scraping
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: default

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: agent
        image: devops-chat-agent:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8357
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: devops-chat-agent-config
        - configMapRef:
            name: devops-chat-agent-env-config
            optional: true  # Created by setup.sh from .env values
        - secretRef:
            name: ai-provider-keys-devops-chat-agent
            optional: true

        # Additional environment variables
        env:
        - name: TRUVAG3_AGENT_NAME
          value: "devops-chat-agent"
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_REDIS_URL  # For backward compatibility
          value: "redis://redis.truvag3-examples:6379"
        # Redis Registration Resilience (handles Redis startup race conditions)
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        - name: TRUVAG3_DEV_MODE
          value: "false"
        # Logging Configuration
        - name: TRUVAG3_LOG_FORMAT
          value: "json"
        # LLM Debug Feature - stores debug payloads in Redis DB 7
        - name: TRUVAG3_LLM_DEBUG_ENABLED
          value: "true"
        # Orchestration configuration
        - name: TRUVAG3_ORCHESTRATOR_MODE
          value: "autonomous"
        # K8s service discovery configuration (CRITICAL for proper registration)
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "devops-chat-agent-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Telemetry Configuration
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"
        # Prevent self-referential orchestration (see orchestration/notes/EXCLUDED_CAPABILITIES_PROPOSAL.md)
        - name: TRUVAG3_EXCLUDED_CAPABILITIES
          value: "devops_operations"
        # Timeout configuration is now in the ConfigMap (.env / .env.example).
        # See TRUVAG3_HTTP_READ_TIMEOUT, TRUVAG3_HTTP_WRITE_TIMEOUT,
        # TRUVAG3_ORCHESTRATION_TIMEOUT, TRUVAG3_EXECUTION_STEP_TIMEOUT,
        # TRUVAG3_ITERATIVE_PHASE_TIMEOUT, TRUVAG3_ITERATIVE_MAX_PHASES
        # in the ConfigMap.

        # Resource limits
        resources:
          requests:
            cpu: "15m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Startup probe (for slow-starting applications)
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: devops-chat-agent-service
  namespace: truvag3-examples
  labels:
    app: devops-chat-agent
    component: agent
    framework: truvag3
    truvag3.framework/type: agent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8357
    protocol: TCP
  selector:
    app: devops-chat-agent

---
# Ingress for external access via devops-chat-agent.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-chat-agent-ingress
  namespace: truvag3-examples
  labels:
    app: devops-chat-agent
    component: agent
    framework: truvag3
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
  - host: devops-chat-agent.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-chat-agent-service
            port:
              number: 80
