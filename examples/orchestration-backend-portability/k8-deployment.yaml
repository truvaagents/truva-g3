apiVersion: v1
kind: ConfigMap
metadata:
  name: portability-backend-config
  namespace: truvag3-examples
  labels:
    app.kubernetes.io/part-of: orchestration-backend-portability
data:
  NATS_URL: nats://portability-nats:4222
  REDIS_URL: redis://redis:6379
  NAMESPACE: truvag3-examples
  PORTABILITY_BACKEND_NAMESPACE: orchestration-portability
  PORTABILITY_QUEUE: portable-work
  PORTABILITY_WORKFLOW_ID: portable-workflow
  PORTABILITY_ACK_WAIT: 2m
  TRUVAG3_SCHEDULER_TICK_INTERVAL: 1s
  TRUVAG3_SCHEDULER_LOCK_TTL: 5s
  TRUVAG3_DISCOVERY_RETRY: "true"
  TRUVAG3_DISCOVERY_RETRY_INTERVAL: 5s
  TRUVAG3_LOG_LEVEL: info
  TRUVAG3_LOG_FORMAT: json
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portability-reference
  namespace: truvag3-examples
  labels:
    app.kubernetes.io/part-of: orchestration-backend-portability
spec:
  ingressClassName: nginx
  rules:
  - host: portability-agent.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portable-agent-api
            port:
              number: 80
  - host: portability-scheduler.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portable-scheduler-tool
            port:
              number: 80
  - host: portability-target.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portable-target-agent
            port:
              number: 80
