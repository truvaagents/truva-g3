apiVersion: apps/v1
kind: Deployment
metadata:
  name: portable-agent-worker
  namespace: truvag3-examples
  labels:
    app: portable-agent-worker
    component: agent-worker
    app.kubernetes.io/part-of: orchestration-backend-portability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portable-agent-worker
  template:
    metadata:
      labels:
        app: portable-agent-worker
        component: agent-worker
        app.kubernetes.io/part-of: orchestration-backend-portability
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: worker
        image: truvag3-portable-agent:local
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: portability-backend-config
        - secretRef:
            name: portability-postgres
        env:
        - name: TRUVAG3_MODE
          value: worker
        - name: PORT
          value: "8080"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
