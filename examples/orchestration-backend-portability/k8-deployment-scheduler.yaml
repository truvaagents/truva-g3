apiVersion: apps/v1
kind: Deployment
metadata:
  name: portable-scheduler-tool
  namespace: truvag3-examples
  labels:
    app: portable-scheduler-tool
    component: tool
    app.kubernetes.io/part-of: orchestration-backend-portability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portable-scheduler-tool
  template:
    metadata:
      labels:
        app: portable-scheduler-tool
        component: tool
        app.kubernetes.io/part-of: orchestration-backend-portability
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: scheduler
        image: truvag3-portable-agent:local
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: portability-backend-config
        - secretRef:
            name: portability-postgres
        env:
        - name: TRUVAG3_MODE
          value: scheduler
        - name: PORT
          value: "8080"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: portable-scheduler-tool
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: portable-scheduler-tool
  namespace: truvag3-examples
  labels:
    app: portable-scheduler-tool
    app.kubernetes.io/part-of: orchestration-backend-portability
spec:
  selector:
    app: portable-scheduler-tool
  ports:
  - name: http
    port: 80
    targetPort: http
