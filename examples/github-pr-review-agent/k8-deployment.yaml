# Kubernetes Deployment for GitHub PR Review Agent (Embedded Mode)
# Namespace: truvag3-examples
# Port: 8382
#
# This manifest runs the agent in embedded mode (api + worker in one pod).
# For production split-mode, deploy k8-deployment-api.yaml + k8-deployment-worker.yaml
# instead and remove this manifest.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-pr-review-agent-config
  namespace: truvag3-examples
  labels:
    app: github-pr-review-agent
    component: agent
    framework: truvag3
data:
  # Deployment identity (kept in YAML — not user-tunable per-env)
  APP_ENV: "production"
  PORT: "8382"
  NAMESPACE: "truvag3-examples"

  # Framework tunables (DEV_MODE, TRUVAG3_LOG_LEVEL, TRUVAG3_LOG_FORMAT,
  # TRUVAG3_LLM_DEBUG_ENABLED, TRUVAG3_RESULT_DISTILL_ENABLED, model aliases,
  # PR review thresholds, posting policy, throttle interval, and all timeouts)
  # are sourced from .env via the github-pr-review-agent-env-config ConfigMap.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-pr-review-agent
  namespace: truvag3-examples
  labels:
    app: github-pr-review-agent
    component: agent
    framework: truvag3
    version: v1
    module: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-pr-review-agent
  template:
    metadata:
      labels:
        app: github-pr-review-agent
        component: agent
        framework: truvag3
        version: v1
        module: orchestration
      annotations:
        # Uses OTLP push-based telemetry to the OTEL Collector, not Prometheus pull
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: default

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: agent
        image: github-pr-review-agent:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8382
          protocol: TCP

        envFrom:
        - configMapRef:
            name: github-pr-review-agent-config
        - configMapRef:
            name: github-pr-review-agent-env-config
            optional: true  # Created by setup.sh from .env values
        - secretRef:
            name: ai-provider-keys-pr-review-agent
            optional: true
        - secretRef:
            name: github-pr-review-agent-webhook
            optional: true  # Holds GITHUB_WEBHOOK_SECRET (and GITHUB_TOKEN if used)

        env:
        - name: TRUVAG3_AGENT_NAME
          value: "github-pr-review-agent"
        # Embedded mode is selected by TRUVAG3_MODE being unset entirely.
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        # Discovery resilience — handles Redis startup race conditions
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        # K8s service discovery (CRITICAL for proper registration)
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "github-pr-review-agent-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Telemetry
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.truvag3-examples:4318"

        resources:
          requests:
            cpu: "15m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: github-pr-review-agent-service
  namespace: truvag3-examples
  labels:
    app: github-pr-review-agent
    component: agent
    framework: truvag3
    truvag3.framework/type: agent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8382
    protocol: TCP
  selector:
    app: github-pr-review-agent

---
# Ingress for external access — primarily for GitHub webhook delivery.
# GitHub PR webhook payloads can exceed default body-size limits on large PRs,
# so the body cap is bumped well above the default 1 MB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-pr-review-agent-ingress
  namespace: truvag3-examples
  labels:
    app: github-pr-review-agent
    component: agent
    framework: truvag3
  annotations:
    # GitHub webhook payloads can be large for PRs with many files
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Long PR review tasks can hold the connection (but webhooks return 202 fast,
    # so these timeouts mostly matter for /api/v1/tasks polling)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: github-pr-review-agent.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: github-pr-review-agent-service
            port:
              number: 80
