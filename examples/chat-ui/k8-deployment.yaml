# Kubernetes Deployment for Chat UI
# Namespace: truvag3-examples
# Port: 80 (nginx)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: truvag3-examples
  labels:
    app: chat-ui
    component: frontend
    framework: truvag3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
        component: frontend
        framework: truvag3
    spec:
      containers:
      - name: nginx
        image: chat-ui:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 80
          protocol: TCP

        # Resource limits
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"

        # Liveness probe - use / since index.html is always present
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui-service
  namespace: truvag3-examples
  labels:
    app: chat-ui
    component: frontend
    framework: truvag3
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: chat-ui

---
# Ingress for external access via chat.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ui-ingress
  namespace: truvag3-examples
  labels:
    app: chat-ui
    component: frontend
    framework: truvag3
spec:
  ingressClassName: nginx
  rules:
  - host: chat.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chat-ui-service
            port:
              number: 80
