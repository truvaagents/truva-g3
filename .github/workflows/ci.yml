name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-state:
    name: release state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Verify local workspace resolution and release bootstraps
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r workspace_dir; do
            module_path="$(cd "$workspace_dir" && GOWORK=off go list -m -f '{{.Path}}')"
            resolved_dir="$(go list -m -f '{{.Dir}}' "$module_path")"
            resolved_dir="$(cd "$resolved_dir" && pwd -P)"
            expected_dir="$(cd "$workspace_dir" && pwd -P)"
            if [[ "$resolved_dir" != "$expected_dir" ]]; then
              echo "::error::${module_path} resolved to ${resolved_dir}; expected local workspace directory ${expected_dir}"
              exit 1
            fi
          done < <(go work edit -json | jq -r '.Use[].DiskPath')

          repository_url="https://github.com/${GITHUB_REPOSITORY}.git"
          while IFS=$'\t' read -r module_path module_version; do
            [[ -n "$module_path" ]] || continue
            if [[ -z "$module_version" ]]; then
              echo "::error::first-party workspace replacement for ${module_path} must be version-scoped"
              exit 1
            fi

            if [[ "$module_path" == "github.com/truvaagents/truva-g3" ]]; then
              release_tag="${module_version}"
            else
              module_name="${module_path#github.com/truvaagents/truva-g3/}"
              release_tag="${module_name}/${module_version}"
            fi

            git ls-remote --exit-code --tags "$repository_url" "refs/tags/${release_tag}" >/dev/null 2>&1 && ls_status=0 || ls_status=$?
            case "$ls_status" in
              0)
                echo "::error::go.work still replaces ${module_path} ${module_version}, but ${release_tag} is already published"
                exit 1
                ;;
              2) ;; # Tag is absent, so the bootstrap replacement remains valid.
              *)
                echo "::error::could not determine whether ${release_tag} is published (git ls-remote exited ${ls_status})"
                exit 1
                ;;
            esac
          done < <(
            go work edit -json |
              jq -r '.Replace[]? | select(.Old.Path == "github.com/truvaagents/truva-g3" or (.Old.Path | startswith("github.com/truvaagents/truva-g3/"))) | [.Old.Path, (.Old.Version // "")] | @tsv'
          )

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Build & test framework modules and optional Bedrock provider
        run: bash scripts/framework-ci.sh test
      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            **/coverage.out
            **/coverage-bedrock.out
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Install pinned linter and report analyzer versions
        run: bash scripts/framework-ci.sh install-lint
      - name: Check framework formatting, vet and lint (including Bedrock)
        run: bash scripts/framework-ci.sh lint

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Install pinned vulnerability scanner and report its version
        run: bash scripts/framework-ci.sh install-vuln
      - name: Scan framework modules and optional Bedrock provider
        run: bash scripts/framework-ci.sh vuln

  examples:
    name: examples (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      # Examples are intentionally out of go.work. Install checkout-local
      # replacements during CI so release-pinned examples also validate the
      # framework changes in this checkout. We only verify they compile — no
      # tests, no lint, no vulnerability scan. This catches framework changes
      # that break example builds without subjecting examples to framework rigor.
      - name: Build all example modules
        env:
          # Examples are not part of go.work; disable workspace mode so each
          # example resolves deps via its own go.mod + replace directives.
          GOWORK: 'off'
        run: |
          set -e
          while IFS= read -r modfile; do
            dir=$(dirname "$modfile")
            echo "::group::build $dir"
            # These edits exist only in the CI checkout; checked-in release
            # dependencies and release Docker builds remain unchanged.
            (cd "$dir" && go mod edit "-replace=github.com/truvaagents/truva-g3=${GITHUB_WORKSPACE}" &&
              for framework_mod in ai core memory orchestration resilience telemetry; do
                go mod edit "-replace=github.com/truvaagents/truva-g3/${framework_mod}=${GITHUB_WORKSPACE}/${framework_mod}"
              done)
            # `go mod tidy` first because framework dep bumps (in core, ai,
            # memory, etc.) propagate to examples via replace directives,
            # which leaves each example's go.sum stale relative to current
            # framework state. This matches what the production Dockerfiles
            # do (Dockerfile.workspace runs `go mod tidy && go mod download`).
            (cd "$dir" && go mod tidy && go build ./...)
            echo "::endgroup::"
          done < <(find examples -name go.mod -type f | sort)
      - name: Compile the shared deployment-helper tests
        # This directory contains only Go tests for the shell helpers.
        # Compile without running tests, matching this job's build-only scope.
        run: go test -run '^$' ./examples/k8-deployment
