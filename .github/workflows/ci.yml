name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Build & test all workspace modules
        run: |
          set -e
          for mod in . ai core memory orchestration resilience telemetry; do
            echo "::group::$mod"
            (cd "$mod" && go build ./... && go test -race -coverprofile=coverage.out -covermode=atomic ./...)
            echo "::endgroup::"
          done
      - name: Build & test optional Bedrock provider
        working-directory: ai
        run: |
          go build -tags bedrock ./...
          go test -race -tags bedrock -coverprofile=coverage-bedrock.out -covermode=atomic ./...
      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            **/coverage.out
            **/coverage-bedrock.out
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true
      - name: Lint all workspace modules
        run: |
          set -e
          for mod in . ai core memory orchestration resilience telemetry; do
            echo "::group::$mod"
            (cd "$mod" && golangci-lint run ./...)
            echo "::endgroup::"
          done
      - name: Lint optional Bedrock provider
        working-directory: ai
        run: golangci-lint run --build-tags bedrock ./providers/bedrock

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run govulncheck on all workspace modules
        run: |
          set -e
          for mod in . ai core memory orchestration resilience telemetry; do
            echo "::group::$mod"
            (cd "$mod" && govulncheck ./...)
            echo "::endgroup::"
          done
      - name: Run govulncheck on optional Bedrock provider
        working-directory: ai
        run: govulncheck -tags bedrock ./providers/bedrock

  examples:
    name: examples (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      # Examples are intentionally out of go.work and use `replace` directives
      # pointing to local framework source. We only verify they compile — no
      # tests, no lint, no vulnerability scan. This catches framework changes
      # that break example builds without subjecting examples to framework rigor.
      - name: Build all example modules
        env:
          # Examples are not part of go.work; disable workspace mode so each
          # example resolves deps via its own go.mod + replace directives.
          GOWORK: 'off'
        run: |
          set -e
          while IFS= read -r modfile; do
            dir=$(dirname "$modfile")
            echo "::group::build $dir"
            # `go mod tidy` first because framework dep bumps (in core, ai,
            # memory, etc.) propagate to examples via replace directives,
            # which leaves each example's go.sum stale relative to current
            # framework state. This matches what the production Dockerfiles
            # do (Dockerfile.workspace runs `go mod tidy && go mod download`).
            (cd "$dir" && go mod tidy && go build ./...)
            echo "::endgroup::"
          done < <(find examples -name go.mod -type f | sort)
