name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/rewrite-getting-started-links.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/rewrite-getting-started-links.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docusaurus build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 is supported by the docs site's declared engine range.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Check high and critical dependency advisories
        working-directory: docs-site
        run: npm audit --audit-level=high
      - name: Typecheck site configuration and components
        working-directory: docs-site
        run: npm run typecheck
      - name: Build site
        # `npm run build` runs the prebuild step (Python sync-docs script) first,
        # then `docusaurus build`. Docusaurus 3.x defaults `onBrokenLinks: throw`,
        # so any broken internal link in docs/ will fail this job.
        working-directory: docs-site
        run: npm run build
