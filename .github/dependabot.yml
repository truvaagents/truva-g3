version: 2

updates:
  # GitHub Actions used by .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Go modules. Dependabot does not understand go.work, so each
  # workspace module is listed individually. Minor and patch updates
  # are grouped to keep PR volume manageable; majors stay separate.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "examples/**"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/ai"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/core"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/memory"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/orchestration"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/resilience"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/telemetry"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/examples/orchestration-backend-portability"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  # Documentation site dependencies.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
